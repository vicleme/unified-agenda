<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="A local-first web agenda with one item model and many lenses."
    />
    <title>Unified Agenda</title>
    <script>
      // Apply the saved theme before the first paint, to avoid a flash of the wrong theme
      try {
        var mode = localStorage.getItem('unified-agenda:theme');
        if (mode === 'light' || mode === 'dark') {
          document.documentElement.dataset.theme = mode;
        }
      } catch (error) {
        // Storage can be blocked, the automatic theme is used then
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
